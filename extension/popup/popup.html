<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DoKee Popup</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }
    .brand span { color: #06b6d4; }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      color: #22d3ee;
      font-weight: 700;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .stat-row:last-child { margin-bottom: 0; }
    .label { color: #9ca3af; }
    .val { font-weight: 700; font-family: monospace; }
    .val-cyan { color: #22d3ee; }
    .val-amber { color: #fbbf24; }
    .val-red { color: #f87171; }
    .val-green { color: #34d399; }
    
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #06b6d4;
      color: #000000;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-secondary {
      background: #1f2937;
      color: #d1d5db;
      border: 1px solid #374151;
      margin-top: 8px;
    }
    .url-list {
      max-height: 80px;
      overflow-y: auto;
      font-size: 11px;
      font-family: monospace;
      color: #9ca3af;
      margin-top: 6px;
      padding-left: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Do<span>Kee</span></div>
    <div className="badge" id="sync-status">DISCONNECTED</div>
  </div>

  <div class="card">
    <div class="stat-row">
      <span class="label">Status:</span>
      <span class="val" id="auth-val">Not Synced</span>
    </div>
    <div class="stat-row">
      <span class="label">Remaining Tolerance:</span>
      <span class="val val-cyan" id="timer-val">00:00</span>
    </div>
    <div class="stat-row">
      <span class="label">Pending Overdue Tasks:</span>
      <span class="val val-amber" id="pending-val">0</span>
    </div>
    <div class="stat-row">
      <span class="label">Surrendered Protocol:</span>
      <span class="val" id="surrender-val">No</span>
    </div>
  </div>

  <div class="card">
    <div class="stat-row">
      <span class="label">Blocked URLs (<span id="url-count">0</span>):</span>
    </div>
    <ul class="url-list" id="url-list">
      <li>Loading...</li>
    </ul>
  </div>

  <button id="sync-btn">Sync Auth from Web App</button>
  <button id="dashboard-btn" class="btn-secondary">Open DoKee Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
